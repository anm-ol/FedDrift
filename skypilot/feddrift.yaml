# FedDrift experiments on our k8s GPUs. Adapted from
# world-captions/skypilot/caption.yaml: workdir-synced (SkyPilot rsyncs the
# local checkout, honoring .gitignore), outputs persisted under /mnt/data/laplace.
#
# Each entry in JOBS is "<script>:<seed>[:<dataset>[:<objective>]]" and gets its own
# GPU (round-robin if there are more jobs than GPUs). dataset is cifar10 (default),
# celeba64 or tinyimagenet; objective is ddpm (default) or fm (flow matching).
# ALPHA overrides the split for every job (default: class, or 0.1 for celeba64).
#
#   sky launch skypilot/feddrift.yaml -c anm-feddrift --env-file .env --down -y -d
#
#   # RegMean seeds 0/1 plus the FedAvg baselines on 4 GPUs:
#   sky launch skypilot/feddrift.yaml -c anm-feddrift --env-file .env --gpus H200:4 \
#     --env "JOBS=run_regmean.sh:0 run_regmean.sh:1 run_fedavg.sh:0 run_fedavg.sh:1"
#
#   # FedAvg vs RegMean on the new datasets, and flow matching on CIFAR:
#   sky launch skypilot/feddrift.yaml -c anm-feddrift --env-file .env --gpus H200:6 \
#     --env "JOBS=run_fedavg.sh:0:celeba64 run_regmean.sh:0:celeba64 run_fedavg.sh:0:tinyimagenet run_regmean.sh:0:tinyimagenet run_fedavg.sh:0:cifar10:fm run_regmean.sh:0:cifar10:fm"
#
#   # re-run on the live cluster after local edits (skips setup):
#   sky exec anm-feddrift skypilot/feddrift.yaml --env-file .env --env "JOBS=..."
#
#   sky logs anm-feddrift            # stream output
#   sky down anm-feddrift            # release the GPUs when done
#
# .env (gitignored) should hold WANDB_API_KEY; without it wandb runs offline.

name: anm-feddrift

resources:
  image_id: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-devel
  accelerators: H200:2
  cpus: 8+
  memory: 32+
  cloud: kubernetes
  # tear the cluster down once the run finishes and it sits idle (always launch with this)
  autostop:
    idle_minutes: 10
    down: true

config: { docker: { run_options: ["--pull=always"] } }

workdir: .

envs:
  JOBS: "run_regmean.sh:0 run_fedavg.sh:0"
  OUT_ROOT: /mnt/data/laplace/feddrift  # only write under /mnt/data/laplace
  ALPHA: ""
  WANDB_API_KEY: ""

setup: |
  set -euo pipefail
  cd ~/sky_workdir
  uv pip install --system --break-system-packages -r requirements.txt

run: |
  set -euo pipefail
  cd ~/sky_workdir
  # sky exec skips setup; keep deps in sync (no-op when satisfied)
  uv pip install --system --break-system-packages -q -r requirements.txt

  # runs/, logs/, data/ and fid.txt live on the shared mount so checkpoints
  # survive `sky down` and measure_drift.py can resume from *_last.tmp
  mkdir -p "$OUT_ROOT"/{runs,logs,data}
  for d in runs logs data; do
    if [ -d "$d" ] && [ ! -L "$d" ]; then cp -rn "$d"/. "$OUT_ROOT/$d"/; rm -rf "$d"; fi
    ln -sfn "$OUT_ROOT/$d" "$d"
  done
  touch "$OUT_ROOT/fid.txt"; ln -sf "$OUT_ROOT/fid.txt" fid.txt

  export WANDB_DIR="$OUT_ROOT"; mkdir -p "$OUT_ROOT/wandb"
  if [ -z "${WANDB_API_KEY:-}" ]; then
    echo "[warn] WANDB_API_KEY not set; wandb runs offline into $OUT_ROOT/wandb (wandb sync later)"
    export WANDB_MODE=offline
  fi

  [ -n "$ALPHA" ] && export ALPHA || unset ALPHA

  # fetch + cache each dataset once (into the shared data/) and write its partitions, in
  # parallel per dataset; each job starts as soon as its own dataset is ready, so CIFAR and
  # Tiny-ImageNet jobs don't wait on CelebA's first ~12GB stream
  R=/tmp/feddrift_ready; rm -rf $R; mkdir -p $R
  for spec in $(for j in $JOBS; do IFS=: read -r _ s d _ <<< "$j"; echo "${d:-cifar10}:$s"; done | sort -u); do
    d=${spec%%:*}; s=${spec##*:}
    a=${ALPHA:-$([ "$d" = celeba64 ] && echo 0.1 || echo class)}
    ( if python -c "from data import load_dataset; load_dataset('$d', './data'); load_dataset('$d', './data', train=False)" \
           > "logs/sky_prefetch_$d.log" 2>&1 \
         && python make_partitions.py --dataset "$d" --alphas "$a" --seed "$s" >> "logs/sky_prefetch_$d.log" 2>&1
      then touch "$R/$spec.ok"; else touch "$R/$spec.fail"; fi ) &
  done

  NGPU=${SKYPILOT_NUM_GPUS_PER_NODE:-1}
  i=0
  for job in $JOBS; do
    IFS=: read -r script seed dataset objective <<< "$job"
    dataset=${dataset:-cifar10}; objective=${objective:-ddpm}
    gpu=$((i % NGPU))
    log="logs/sky_${script%.sh}_${dataset}_${objective}_s$seed.log"
    echo "[job] GPU $gpu: $dataset/$objective bash $script $seed (log: $OUT_ROOT/$log)"
    ( until [ -e "$R/$dataset:$seed.ok" ] || [ -e "$R/$dataset:$seed.fail" ]; do sleep 10; done
      [ -e "$R/$dataset:$seed.ok" ] || { echo "[job] prefetch failed for $dataset, see logs/sky_prefetch_$dataset.log"; exit 1; }
      echo "[job] $dataset ready, starting $script $seed on GPU $gpu"
      DATASET=$dataset OBJECTIVE=$objective CUDA_VISIBLE_DEVICES=$gpu bash "$script" "$seed" > "$log" 2>&1 ) &
    i=$((i + 1))
  done

  fail=0
  for pid in $(jobs -p); do wait "$pid" || fail=1; done
  echo "results in $OUT_ROOT (runs/, logs/, fid.txt)"
  exit $fail
